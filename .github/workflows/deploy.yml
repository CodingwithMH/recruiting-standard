name: CD Pipeline

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply Database Migrations
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Generate Prisma Client
        run: npm --prefix server run prisma:generate

      - name: Apply committed migrations
        working-directory: server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy --schema prisma/schema.prisma

  deploy-api:
    name: Deploy API (Render)
    needs: migrate
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"

  deploy-client:
    name: Deploy Client (Vercel)
    needs: migrate
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Deploy to Vercel
        working-directory: client
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          IS_PRODUCTION: ${{ github.ref_name == 'main' }}
        run: |
          if [ "$IS_PRODUCTION" = "true" ]; then
            npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
            npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
            npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
          else
            npx --yes vercel@latest pull --yes --environment=preview --token="$VERCEL_TOKEN"
            npx --yes vercel@latest build --token="$VERCEL_TOKEN"
            npx --yes vercel@latest deploy --prebuilt --token="$VERCEL_TOKEN"
          fi
