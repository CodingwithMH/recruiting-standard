name: CD Pipeline

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply Database Migrations
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify DATABASE_URL is configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL resolved to an empty string. Add it as a secret to the '${{ github.ref_name == 'main' && 'production' || 'staging' }}' GitHub Environment (Settings > Environments)."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Generate Prisma Client
        run: npm --prefix server run prisma:generate

      - name: Apply committed migrations
        working-directory: server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy --schema prisma/schema.prisma

  deploy-api:
    name: Deploy API (Vercel)
    needs: migrate
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Deploy API to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_SERVER || secrets.VERCEL_SERVER_PROJECT_ID || secrets.VERCEL_PROJECT_ID_API || secrets.SERVER_VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_SERVER || secrets.VERCEL_SERVER_TOKEN || secrets.VERCEL_TOKEN }}
          IS_PRODUCTION: ${{ github.ref_name == 'main' }}
        run: |
          CLEAN_PROJECT_ID=$(echo "$VERCEL_PROJECT_ID" | tr -d '"'\''\r\n ')
          CLEAN_ORG_ID=$(echo "$VERCEL_ORG_ID" | tr -d '"'\''\r\n ')
          export VERCEL_PROJECT_ID="$CLEAN_PROJECT_ID"
          export VERCEL_ORG_ID="$CLEAN_ORG_ID"

          echo "Server Project ID character count: ${#VERCEL_PROJECT_ID}"
          echo "Server Project ID preview: ${VERCEL_PROJECT_ID:0:6}...${VERCEL_PROJECT_ID: -4}"

          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::Missing Vercel secrets for Server (VERCEL_TOKEN, VERCEL_ORG_ID, or VERCEL_PROJECT_ID_SERVER). Skipping API deployment."
            exit 0
          fi
          if [ "$IS_PRODUCTION" = "true" ]; then
            npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
            npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
            npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
          else
            npx --yes vercel@latest pull --yes --environment=preview --token="$VERCEL_TOKEN"
            npx --yes vercel@latest build --token="$VERCEL_TOKEN"
            npx --yes vercel@latest deploy --prebuilt --token="$VERCEL_TOKEN"
          fi

  deploy-client:
    name: Deploy Client (Vercel)
    needs: migrate
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install client dependencies
        run: npm --prefix client ci

      - name: Deploy Client to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_CLIENT || secrets.VERCEL_CLIENT_PROJECT_ID || secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_CLIENT || secrets.VERCEL_CLIENT_TOKEN || secrets.VERCEL_TOKEN }}
          IS_PRODUCTION: ${{ github.ref_name == 'main' }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::Missing Vercel secrets for Client (VERCEL_TOKEN, VERCEL_ORG_ID, or VERCEL_PROJECT_ID_CLIENT). Skipping Client deployment."
            exit 0
          fi
          if [ "$IS_PRODUCTION" = "true" ]; then
            npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
            npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
            npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
          else
            npx --yes vercel@latest pull --yes --environment=preview --token="$VERCEL_TOKEN"
            npx --yes vercel@latest build --token="$VERCEL_TOKEN"
            npx --yes vercel@latest deploy --prebuilt --token="$VERCEL_TOKEN"
          fi
